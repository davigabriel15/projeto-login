<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="imagem">
        </section>
        <h1>Login</h1>
        <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder 
            fazer as configurações do seu ambiente.
        </p>
        <form action="cadstro">
            <fieldset id="usuario">
                <label for="iusu"><img src="Imagem/icone_de_conta.png.png" alt=""></label>
                <input type="email" name="usu" id="iusu" placeholder="Seu e-mail">
            </fieldset>
        </form>
    </main>
</body>
</html>
