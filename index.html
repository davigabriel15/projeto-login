<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="imagem">
        </section>
        <h1>Login</h1>
        <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder 
            fazer as configurações do seu ambiente.
        </p>
        <form action="cadastro">
            <fieldset id="usuario">
                <label for="iusu"><img src="Imagem/icone_de_conta.png.png" alt="Icone de login"></label>
                <input type="email" name="usu" id="iusu" placeholder="Seu e-mail" required>
            </fieldset>

            <fieldset id="usuario">
                <label for="icha"><img src="Imagem/icone_de_chave.png" alt="Icone de Chave"></label>
                <input type="password" name="cha" id="icha" placeholder="Sua senha" required>
            </fieldset>

            <input type="submit" value="Entrar" id="env">

        </form>
    </main>
</body>
</html>
