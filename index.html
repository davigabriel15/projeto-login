<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_box" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="imagem"></section>
        <h1>Login</h1>
        <p>Bem vindo(a) novamente! Faça Login para acessar sua Conta e Poder Fazer as Configurações do seu ambiente</p>
        <form action="cadastro">
            <fieldset id="usuario">
                <label for="iusu"><span class="material-symbols-outlined">account_box</span></label>
                <input type="email" name="usu" id="iusu">
            </fieldset>

        </form>
    </main>
    
</body>
</html>
